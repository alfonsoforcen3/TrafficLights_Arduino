<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Traffic Lights — AI activity, at a glance</title>
  <desc id="desc">A Bluetooth traffic light beside labels for Codex, Claude Code, Gemini CLI and Cursor. A physical indicator for multiple local AI chats.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e35"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ffc563" stop-opacity=".25"/><stop offset="1" stop-color="#ffc563" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <path d="M785 0V360M0 300H1200" stroke="#25344a" stroke-opacity=".6"/>
  <text x="54" y="66" fill="#8ce0ca" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="3">PHYSICAL STATUS · BLUETOOTH · MACOS</text>
  <text x="50" y="137" fill="#f4f7fc" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="700" letter-spacing="-2">Traffic Lights</text>
  <text x="54" y="185" fill="#c0cee0" font-family="Arial,Helvetica,sans-serif" font-size="25">Your AI activity, at a glance.</text>
  <text x="54" y="225" fill="#8497b2" font-family="Arial,Helvetica,sans-serif" font-size="17">Multiple chats. One clear signal.</text>
  <g font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#d7e3f2">
    <rect x="54" y="253" width="86" height="29" rx="14" fill="#1b2d43"/><text x="73" y="272">Codex</text>
    <rect x="151" y="253" width="131" height="29" rx="14" fill="#1b2d43"/><text x="169" y="272">Claude Code</text>
    <rect x="293" y="253" width="128" height="29" rx="14" fill="#1b2d43"/><text x="311" y="272">Gemini CLI</text>
    <rect x="432" y="253" width="89" height="29" rx="14" fill="#1b2d43"/><text x="450" y="272">Cursor</text>
  </g>
  <circle cx="978" cy="157" r="145" fill="url(#glow)"/>
  <rect x="944" y="258" width="68" height="46" rx="8" fill="#23334b"/>
  <rect x="902" y="308" width="152" height="12" rx="6" fill="#30445e"/>
  <rect x="916" y="37" width="124" height="233" rx="34" fill="#142238" stroke="#42536b" stroke-width="2"/>
  <circle cx="978" cy="88" r="26" fill="#49242d" stroke="#794151" stroke-width="2"/>
  <circle cx="978" cy="155" r="28" fill="#ffbf53"/>
  <circle cx="971" cy="148" r="12" fill="#ffe3ad" fill-opacity=".45"/>
  <circle cx="978" cy="222" r="26" fill="#163e39" stroke="#317768" stroke-width="2"/>
  <circle cx="54" cy="328" r="4" fill="#ffc563"/>
  <text x="69" y="333" fill="#97abc3" font-family="Arial,Helvetica,sans-serif" font-size="12">TESTER PREVIEW · PROVIDER VERIFICATION TRACKED IN THE DOCS</text>
</svg>
